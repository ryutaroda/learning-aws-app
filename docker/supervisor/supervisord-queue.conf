[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:health-check-server]
command=php -S localhost:8080 -t /var/www/public /var/www/public/index.php
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/queue-worker.sh
directory=/var/www
autostart=true
autorestart=true
startretries=3
startsecs=10
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=3600
priority=5

